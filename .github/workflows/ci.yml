name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.8.8"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  frontend:
    name: Frontend (lint, types, unit tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: No known vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=low
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.8.8"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: (cd ../backend && uv sync --frozen)
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 7

  docker:
    name: Docker Compose
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up --build --detach --wait --wait-timeout 180
      - run: curl --fail --silent http://localhost:8000/api/health
      - run: curl --fail --silent "http://localhost:8000/api/leads?tz=Asia/Calcutta" > /dev/null
      - run: curl --fail --silent --output /dev/null http://localhost:3000
      - name: Data survives a restart
        run: |
          id=$(curl --fail --silent -X POST http://localhost:8000/api/leads \
            -H 'Content-Type: application/json' -d '{"name": "CI persistence check"}' \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["lead"]["id"])')
          docker compose down
          docker compose up --detach --wait --wait-timeout 120
          curl --fail --silent "http://localhost:8000/api/leads/$id" | grep -q "CI persistence check"
          docker compose logs api | grep -q "leaving it as it is"
          echo "Lead $id survived the restart and the demo data was not re-seeded."
      - if: always()
        run: docker compose logs && docker compose down -v
